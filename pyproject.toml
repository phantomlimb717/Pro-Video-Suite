[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pro-video-suite"
version = "1.0.0"
description = "A cross-platform YouTube downloader + video trimmer/converter built on PySide6."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "phantomlimb717" }]
keywords = ["video", "youtube", "yt-dlp", "ffmpeg", "pyside6", "downloader", "editor"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "PySide6==6.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pyinstaller>=6.10",
]

[project.gui-scripts]
pro-video-suite = "pro_video_suite.__main__:main"

[project.urls]
Homepage = "https://github.com/phantomlimb717/Pro-Video-Suite"
Repository = "https://github.com/phantomlimb717/Pro-Video-Suite"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pro_video_suite = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
