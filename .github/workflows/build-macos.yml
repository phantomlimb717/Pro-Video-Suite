name: Build macOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest  # Apple Silicon runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm ProVideoSuite.spec

      - name: Zip the .app bundle
        run: |
          cd dist
          ditto -c -k --keepParent "Pro Video Suite.app" "Pro-Video-Suite-macOS.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pro-Video-Suite-macOS
          path: dist/Pro-Video-Suite-macOS.zip
